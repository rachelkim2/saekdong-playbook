function Pill({ status, children, className="" }) {
  const cls = `status-${status}`;
  return (
    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium border ${cls} ${status==="abandoned"?"abandoned-strike":""} ${className}`}>
      <span className={`inline-block w-1.5 h-1.5 rounded-full dot-${status}`}></span>
      {children || statusLabel(status)}
    </span>
  );
}

function statusLabel(s) {
  return { validated:"검증됨", in_progress:"진행중", needs_more_data:"추가검증", abandoned:"폐기" }[s] || s;
}

function IdChip({ id, onClick }) {
  return <span className="chip-id" onClick={onClick} role="button">{id}</span>;
}

// 구글드라이브 URL에서 file ID 추출 (여러 형태 지원)
function getDriveId(url) {
  if (!url) return null;
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
  if (m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if (m) return m[1];
  m = url.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if (m) return m[1];
  return null;
}

function Thumb({ title, type, thumbnailUrl, driveUrl }) {
  const icon = type==="banner" ? "🖼️" : type==="shortform" ? "📱" : type==="viral_pa" ? "🌀" : "🎬";
  const driveId = getDriveId(driveUrl);
  const [playing, setPlaying] = useState(false);

  // drive_url 있고 thumbnail_url 없으면 드라이브에서 자동 썸네일 가져오기
  const effectiveThumb = thumbnailUrl || (driveId ? `https://lh3.googleusercontent.com/d/${driveId}=w500` : null);

  // 카드 안 iframe 재생 모드
  if (playing && driveId) {
    return (
      <div style={{aspectRatio:"4/3", minHeight:"96px", position:"relative", borderRadius:"6px", overflow:"hidden", border:"1px solid #E5DDD0", background:"#000"}}>
        <iframe src={`https://drive.google.com/file/d/${driveId}/preview`}
          style={{width:"100%", height:"100%", border:"none"}}
          allow="autoplay; fullscreen" allowFullScreen
          title={title} />
        <button onClick={(e)=>{e.preventDefault(); e.stopPropagation(); setPlaying(false);}}
          style={{position:"absolute", top:"4px", right:"4px", width:"22px", height:"22px", borderRadius:"50%", background:"rgba(0,0,0,0.65)", color:"white", border:"none", cursor:"pointer", fontSize:"12px", lineHeight:1, display:"flex", alignItems:"center", justifyContent:"center"}}
          title="닫기">×</button>
      </div>
    );
  }

  const inner = effectiveThumb ? (
    <div style={{aspectRatio:"4/3", minHeight:"96px", position:"relative", borderRadius:"6px", overflow:"hidden", border:"1px solid #E5DDD0", cursor: driveId ? "pointer" : "default"}}
         onClick={driveId ? (e)=>{e.preventDefault(); e.stopPropagation(); setPlaying(true);} : undefined}>
      <img src={effectiveThumb} alt={title}
        style={{width:"100%", height:"100%", objectFit:"cover"}}
        onError={(e)=>{ e.target.style.display="none"; e.target.parentElement.classList.add("placeholder-thumb"); const playIco = driveId ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none"><div style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.65);color:white;display:flex;align-items:center;justify-content:center;font-size:14px">▶</div></div>` : ""; e.target.parentElement.innerHTML = `<div class="text-lg">${icon}</div><div class="mt-1 font-medium leading-tight" style="font-size:11px">${title}</div>${playIco}`; }} />
      {driveId && (
        <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}>
          <div style={{width:"36px", height:"36px", borderRadius:"50%", background:"rgba(0,0,0,0.65)", color:"white", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"14px", paddingLeft:"3px"}}>▶</div>
        </div>
      )}
      <div style={{position:"absolute", bottom:0, left:0, right:0, padding:"4px 6px", background:"linear-gradient(to top, rgba(0,0,0,0.7), transparent)", color:"white", fontSize:"10px", fontWeight:500, lineHeight:1.2}}>
        {title}
      </div>
      {driveUrl && (
        <a href={driveUrl} target="_blank" rel="noopener noreferrer"
           onClick={(e)=>e.stopPropagation()}
           title="Drive에서 열기"
           style={{position:"absolute", top:"4px", right:"4px", width:"22px", height:"22px", borderRadius:"4px", background:"rgba(0,0,0,0.5)", color:"white", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"11px", textDecoration:"none"}}>↗</a>
      )}
    </div>
  ) : (
    <div className="placeholder-thumb" style={{aspectRatio:"4/3", minHeight:"96px", position:"relative", cursor: driveId ? "pointer" : "default"}}
         onClick={driveId ? (e)=>{e.preventDefault(); setPlaying(true);} : undefined}>
      <div className="text-lg">{icon}</div>
      <div className="mt-1 font-medium leading-tight">{title}</div>
      {driveId && (
        <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", pointerEvents:"none"}}>
          <div style={{width:"32px", height:"32px", borderRadius:"50%", background:"rgba(0,0,0,0.55)", color:"white", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"13px", paddingLeft:"3px"}}>▶</div>
        </div>
      )}
    </div>
  );
  return inner;
}

function fmt(n, d=0) {
  if (n===undefined || n===null) return "—";
  if (typeof n !== "number") return n;
  return n.toLocaleString("ko-KR", {maximumFractionDigits:d});
}
function fmtPct(n) {
  if (n===undefined || n===null) return "—";
  return (n*100).toFixed(2)+"%";
}
function fmtRoas(r) {
  if (r===undefined || r===null) return "—";
  return (r*100).toFixed(0)+"%";
}
function fmtKRW(n) {
  if (n===undefined || n===null) return "—";
  return "₩"+fmt(n);
}

// ----------------- Mind Map (d3.tree) -----------------
function MindMap({ track, hypotheses, onNodeClick, filters }) {
  const ref = useRef();
  useEffect(()=>{
    if (!ref.current) return;
    const filtered = hypotheses.filter(h => {
      if (filters.status.size && !filters.status.has(h.status)) return false;
      if (filters.category.size && !filters.category.has(h.category)) return false;
      if (filters.source.size && !filters.source.has(h.source_type)) return false;
      return true;
    });
    const visibleIds = new Set(filtered.map(h=>h.id));

    const trackLabelMap = { A:"롱폼", D:"바이럴 PA·PPL", B:"숏폼·배너" };
    const rootName = `밀키토너 — ${trackLabelMap[track] || track}`;
    const cats = Array.from(new Set(filtered.map(h=>h.category)));
    // Build tree: root → category → top-level (orphan or filtered parent) → children
    function pickChildren(parentId) {
      return filtered.filter(h => h.parent_id === parentId || (parentId === null && (h.parent_id === null || !visibleIds.has(h.parent_id))))
        .map(h => ({
          name: h.id,
          h,
          children: pickChildren(h.id),
        }));
    }
    const data = {
      name: rootName,
      isRoot:true,
      children: cats.map(c => ({
        name: c,
        isCat: true,
        children: filtered.filter(h => h.category===c && (h.parent_id === null || !visibleIds.has(h.parent_id)))
          .map(h => ({ name:h.id, h, children: pickChildren(h.id) }))
      })).filter(c => c.children.length>0)
    };

    const svg = d3.select(ref.current);
    svg.selectAll("*").remove();
    const containerWidth = ref.current.parentElement.clientWidth;
    const root = d3.hierarchy(data);

    // nodeSize로 일관된 간격 — 행 높이 38, 열 폭 280 (텍스트 + 다음 노드 여백)
    const rowHeight = 38;
    const colWidth = 280;
    const treeLayout = d3.tree().nodeSize([rowHeight, colWidth])
      .separation((a, b) => (a.parent === b.parent ? 1 : 1.2));
    treeLayout(root);

    // 실제 bounding box 계산 (음수 좌표 포함)
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    root.each(d => {
      if (d.x < minX) minX = d.x;
      if (d.x > maxX) maxX = d.x;
      if (d.y < minY) minY = d.y;
      if (d.y > maxY) maxY = d.y;
    });
    const padX = 90;          // 좌우 여백 (root 박스 폭 고려)
    const padTextRight = 220; // 텍스트가 오른쪽으로 펴지는 공간
    const svgWidth = (maxY - minY) + padX + padTextRight;
    const svgHeight = (maxX - minX) + 60;
    svg.attr("viewBox", `0 0 ${svgWidth} ${svgHeight}`);
    svg.attr("preserveAspectRatio", "xMinYMin meet");
    svg.style("min-width", `${Math.max(svgWidth, containerWidth)}px`);

    const g = svg.append("g").attr("transform", `translate(${padX - minY}, ${30 - minX})`);

    g.selectAll("path.link")
      .data(root.links())
      .enter()
      .append("path")
      .attr("class", d => "tree-link" + (d.target.data.h && d.target.data.h.status==="abandoned" ? " tree-link-abandoned" : ""))
      .attr("d", d3.linkHorizontal().x(d=>d.y).y(d=>d.x));

    const nodes = g.selectAll("g.node")
      .data(root.descendants())
      .enter()
      .append("g")
      .attr("class","node")
      .attr("transform", d => `translate(${d.y},${d.x})`)
      .style("cursor", d => d.data.h ? "pointer" : "default")
      .on("click", (e,d) => { if (d.data.h) onNodeClick(d.data.h.id); });

    nodes.each(function(d){
      const sel = d3.select(this);
      if (d.data.isRoot) {
        sel.append("rect").attr("x",-90).attr("y",-14).attr("width",180).attr("height",28).attr("rx",14)
          .attr("fill","#2B2520").attr("stroke","#2B2520");
        sel.append("text").attr("text-anchor","middle").attr("dy",4).attr("fill","#FFFDF8")
          .style("font-size","12px").style("font-weight","600").style("font-family","Pretendard")
          .text(d.data.name);
      } else if (d.data.isCat) {
        sel.append("rect").attr("x",-50).attr("y",-12).attr("width",100).attr("height",24).attr("rx",4)
          .attr("fill","#F0D9CE").attr("stroke","#C97B5E");
        sel.append("text").attr("text-anchor","middle").attr("dy",4).attr("fill","#A85F44")
          .style("font-size","11px").style("font-weight","600").style("font-family","Pretendard")
          .text("#"+d.data.name);
      } else {
        const h = d.data.h;
        const color = {validated:"#4F7A4C", in_progress:"#C29A3A", needs_more_data:"#6A7FA0", abandoned:"#9C7080"}[h.status];
        const bg = {validated:"#DDE9D9", in_progress:"#F1E6C2", needs_more_data:"#DCE3EE", abandoned:"#E8D9DE"}[h.status];
        // ID 배지
        sel.append("rect").attr("x",-30).attr("y",-10).attr("width",60).attr("height",20).attr("rx",10)
          .attr("fill",bg).attr("stroke",color).attr("stroke-width",1.2);
        sel.append("text").attr("text-anchor","middle").attr("dy",3.5).attr("fill",color)
          .style("font-size","10.5px").style("font-weight","600").style("font-family","JetBrains Mono")
          .style("text-decoration", h.status==="abandoned" ? "line-through" : "none")
          .text(h.id);

        // 타이틀 — 다음 노드와의 간격(280px) 안에 들어가도록 24자 제한
        const MAX_CHARS = 22;
        const title = h.title.length > MAX_CHARS ? h.title.slice(0, MAX_CHARS-1)+"…" : h.title;
        sel.append("title").text(`[${h.id}] ${h.title}\n\n${h.full_text}`);
        // 배경 흰색 박스 (오버랩 방지용)
        const textEl = sel.append("text").attr("x",36).attr("dy",3.5).attr("fill","#5A4F47")
          .style("font-size","11px").style("font-family","Pretendard")
          .style("pointer-events","none")
          .text(title);
        // 텍스트 뒷배경 (가독성)
        const bbox = textEl.node().getBBox();
        sel.insert("rect", "text:nth-of-type(2)")
          .attr("x", bbox.x - 3).attr("y", bbox.y - 1)
          .attr("width", bbox.width + 6).attr("height", bbox.height + 2)
          .attr("fill", "#FFFDF8").attr("opacity", 0.85).attr("rx", 2);
        // 다시 텍스트를 최상단으로
        sel.append(() => textEl.remove().node());
      }
    });
  }, [hypotheses, filters, track, onNodeClick]);

  return <svg ref={ref} style={{width:"100%", height:"auto"}} />;
}

// ----------------- Views -----------------
function ViewOverview({ track, jumpTo }) {
  const hyps = HYPOTHESES.filter(h=>h.track===track);
  const counts = {
    validated: hyps.filter(h=>h.status==="validated").length,
    in_progress: hyps.filter(h=>h.status==="in_progress").length,
    needs_more_data: hyps.filter(h=>h.status==="needs_more_data").length,
    abandoned: hyps.filter(h=>h.status==="abandoned").length,
  };
  const top3 = INSIGHTS.filter(i=>i.track===track).slice(0,3);
  const sourceTypes = ["internal_evolved","competitor_followup","trend_test","serendipity"];
  const sourceCounts = sourceTypes.map(s => ({ s, n: hyps.filter(h=>h.source_type===s).length }));
  const maxN = Math.max(...sourceCounts.map(x=>x.n), 1);
  const recent = [...hyps].sort((a,b)=>b.updated_date.localeCompare(a.updated_date)).slice(0,7);

  return (
    <div className="anim-fade space-y-6">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {[
          {k:"validated", label:"검증됨"},
          {k:"in_progress", label:"진행중"},

        <div className="card-deep p-5">
          <div className="flex items-center justify-between mb-3">

function ViewTracker() {
  const [filterOwner, setFilterOwner] = useState("");
  const [filterAngle, setFilterAngle] = useState("");
  const [filterFormat, setFilterFormat] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [query, setQuery] = useState("");
  const [expandedRow, setExpandedRow] = useState(null);

  const owners = Array.from(new Set(TRACKER.map(r=>r.o))).sort();
  const angles = Array.from(new Set(TRACKER.map(r=>r.a))).sort();
  const formats = Array.from(new Set(TRACKER.map(r=>r.f))).sort();
  const statuses = Array.from(new Set(TRACKER.map(r=>r.s).filter(Boolean))).sort();

  const filtered = TRACKER.filter(r => {
    if (filterOwner && r.o !== filterOwner) return false;
    if (filterAngle && r.a !== filterAngle) return false;
    if (filterFormat && r.f !== filterFormat) return false;
    if (filterStatus && r.s !== filterStatus) return false;
    if (query) {
      const q = query.toLowerCase();
      const text = (r.n + " " + r.hyp + " " + r.ins + " " + r.next + " " + r.res).toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });

  // Parse roas from res like "₩123,456 / 208%"
  function parseRoas(res) {
    if (!res || res === "-" || res === "(드랍)") return null;
    const m = res.match(/([0-9.]+)%/);
    return m ? parseFloat(m[1])/100 : null;
  }
  function roasColor(r) {
    if (r === null || r === undefined) return "#8C7F73";
    if (r >= 1.8) return "#4F7A4C";
    if (r >= 1.2) return "#7A8F5A";
    if (r >= 1.0) return "#C29A3A";
    return "#9C7080";
  }
  function statusColor(s) {
    return {
      "완료": "#4F7A4C",
      "편집": "#C29A3A",
      "촬영": "#C29A3A",
      "기획": "#6A7FA0",
      "드랍": "#9C7080",
    }[s] || "#8C7F73";
  }
  function formatIcon(f) {
    return { "롱폼":"🎬", "숏폼":"📱", "배너":"🖼️", "카드뉴스":"📰" }[f] || "📄";
  }

  return (
    <div className="anim-fade">
      <div className="mb-3 flex items-baseline justify-between">
        <div>
          <h2 className="font-display text-2xl" style={{color:"#2B2520"}}>운영 트래커</h2>
          <p className="text-xs" style={{color:"#5A4F47"}}>
            출처: <a href="https://docs.google.com/spreadsheets/d/14NVDVi7Hg5FcqVI1o9kfQl03s5tDDrnBx4NtTzuFJgE/edit" target="_blank" rel="noopener noreferrer" className="hover:underline" style={{color:"#A85F44"}}>[색동] 2026년 콘텐츠 운영 트래커 ↗</a>
            <span className="ml-2 font-mono" style={{color:"#8C7F73"}}>총 {TRACKER.length}건 · 필터 후 {filtered.length}건</span>
          </p>
        </div>
      </div>

      {/* Filters */}
      <div className="card-deep p-3 mb-4 flex flex-wrap gap-2 items-center text-xs">
        <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="🔍 콘텐츠명·가설·인사이트 검색"
          className="px-3 py-1.5 rounded-md w-64 focus:outline-none"
          style={{background:"#FFFDF8", border:"1px solid #E5DDD0"}} />
        <select value={filterOwner} onChange={(e)=>setFilterOwner(e.target.value)}
          className="px-2 py-1.5 rounded-md focus:outline-none"
          style={{background:"#FFFDF8", border:"1px solid #E5DDD0"}}>
          <option value="">담당자 전체</option>
          {owners.map(o=><option key={o} value={o}>{o} ({OWNERS[o] || o})</option>)}
        </select>
        <select value={filterAngle} onChange={(e)=>setFilterAngle(e.target.value)}
          className="px-2 py-1.5 rounded-md focus:outline-none"
          style={{background:"#FFFDF8", border:"1px solid #E5DDD0"}}>
          <option value="">소구점 전체</option>
          {angles.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <select value={filterFormat} onChange={(e)=>setFilterFormat(e.target.value)}
          className="px-2 py-1.5 rounded-md focus:outline-none"
          style={{background:"#FFFDF8", border:"1px solid #E5DDD0"}}>
          <option value="">형식 전체</option>
          {formats.map(f=><option key={f} value={f}>{f}</option>)}
        </select>
        <select value={filterStatus} onChange={(e)=>setFilterStatus(e.target.value)}
          className="px-2 py-1.5 rounded-md focus:outline-none"
          style={{background:"#FFFDF8", border:"1px solid #E5DDD0"}}>
          <option value="">상태 전체</option>
          {statuses.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>{setFilterOwner("");setFilterAngle("");setFilterFormat("");setFilterStatus("");setQuery("");}}
          className="px-2 py-1.5 rounded-md hover:opacity-80"
          style={{background:"#F0D9CE", color:"#A85F44", border:"1px solid #C97B5E"}}>
          초기화
        </button>
      </div>

      {/* Table */}
      <div className="card-deep overflow-x-auto">
        <table className="w-full text-xs">
          <thead style={{background:"#F4EFE5"}}>
            <tr style={{color:"#5A4F47"}}>
              <th className="p-2 text-left font-semibold">담당자</th>
              <th className="p-2 text-left font-semibold">콘텐츠명</th>
              <th className="p-2 text-left font-semibold">소구점</th>
              <th className="p-2 text-left font-semibold">형식</th>
              <th className="p-2 text-left font-semibold">상태</th>
              <th className="p-2 text-left font-semibold">기획주차</th>
              <th className="p-2 text-left font-semibold">아웃풋</th>
              <th className="p-2 text-left font-semibold">결과</th>
              <th className="p-2 font-semibold w-6"></th>
            </tr>
          </thead>
          <tbody className="divide-y" style={{borderColor:"#EFE8DA"}}>
            {filtered.map((r, idx) => {
              const expanded = expandedRow === idx;
              const roas = parseRoas(r.res);
              return (
                <React.Fragment key={idx}>
                  <tr className="hover:bg-cream-deep cursor-pointer" onClick={()=>setExpandedRow(expanded?null:idx)}
                    style={{color:"#2B2520"}}>
                    <td className="p-2">
                      <span className="font-mono text-[10px] px-1.5 py-0.5 rounded" style={{background:"#F4EFE5", color:"#5A4F47"}}>{r.o}</span>
                    </td>
                    <td className="p-2 font-medium">{r.n}</td>
                    <td className="p-2"><span className="text-[10px] px-1.5 py-0.5 rounded" style={{background:"#F0D9CE", color:"#A85F44"}}>#{r.a}</span></td>
                    <td className="p-2">{formatIcon(r.f)} {r.f}</td>
                    <td className="p-2">
                      {r.s && <span className="text-[10px] px-1.5 py-0.5 rounded" style={{background:statusColor(r.s)+"22", color:statusColor(r.s), border:"1px solid "+statusColor(r.s)+"55"}}>{r.s}</span>}
                    </td>
                    <td className="p-2 text-[10px]" style={{color:"#8C7F73"}}>{r.wP}</td>
                    <td className="p-2 text-[10px]" style={{color:"#8C7F73"}}>{r.wO}</td>
                    <td className="p-2 font-mono" style={{color: roasColor(roas)}}>
                      {r.res !== "-" ? r.res : <span style={{color:"#8C7F73"}}>—</span>}
                    </td>
                    <td className="p-2 text-center">
                      <span style={{color:"#8C7F73"}}>{expanded ? "▾" : "▸"}</span>
                    </td>
                  </tr>
                  {expanded && (
                    <tr style={{background:"#FAF7F1"}}>
                      <td colSpan="9" className="p-3">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                          <div>
                            <div className="text-[10px] font-semibold mb-1" style={{color:"#A85F44"}}>가설</div>
                            <div className="text-[11px] leading-relaxed" style={{color:"#2B2520"}}>{r.hyp || "—"}</div>
                          </div>
                          <div>
                            <div className="text-[10px] font-semibold mb-1" style={{color:"#A85F44"}}>인사이트</div>
                            <div className="text-[11px] leading-relaxed" style={{color:"#2B2520"}}>{r.ins || "—"}</div>
                          </div>
                          <div>
                            <div className="text-[10px] font-semibold mb-1" style={{color:"#A85F44"}}>다음 액션</div>
                            <div className="text-[11px] leading-relaxed" style={{color:"#2B2520"}}>{r.next || "—"}</div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="mt-3 text-[11px] text-center" style={{color:"#8C7F73"}}>
        행 클릭 → 가설·인사이트·다음 액션 펼치기 · 정량 데이터는 위클리 체크인·콘텐츠 리뷰 본문 기준
      </div>
    </div>
  );
}

function ViewOpsLog() {
  const sorted = [...OPS_LOG].sort((a,b)=>b.date.localeCompare(a.date));
  const catColor = {
    "유통":"#6A7FA0","신제품":"#4F7A4C","가격":"#C29A3A",
    "디자인":"#9C7080","바이럴":"#A85F44","재고":"#5A4F47"
  };
  return (
    <div className="anim-fade">
      <div className="mb-4">
        <h2 className="font-display text-2xl" style={{color:"#2B2520"}}>운영 로그</h2>
        <p className="text-sm" style={{color:"#5A4F47"}}>가설 관리가 아닌 의사결정 기록. 가격·재고·신제품·디자인·유통·바이럴 운영 흐름.</p>
      </div>
      <div className="relative ml-4 pl-6" style={{borderLeft:"2px solid #E5DDD0"}}>
        {sorted.map(op=>(
          <div key={op.id} className="relative mb-5">
            <div className="absolute -left-[34px] top-1 w-3 h-3 rounded-full" style={{background:catColor[op.category]||"#C97B5E", boxShadow:"0 0 0 4px #FAF7F1"}}></div>
            <div className="card-deep p-4">
              <div className="flex items-center gap-2 mb-1.5">
                <IdChip id={op.id} />
                <span className="text-[11px] px-1.5 rounded" style={{background:(catColor[op.category]||"#C97B5E")+"22", color:catColor[op.category]||"#A85F44"}}>#{op.category}</span>
                <span className="text-[11px] font-mono" style={{color:"#8C7F73"}}>{op.date}</span>
              </div>
              <h3 className="font-display text-lg leading-tight mb-1" style={{color:"#2B2520"}}>{op.title}</h3>
              <p className="text-sm leading-relaxed mb-2" style={{color:"#5A4F47"}}>{op.body}</p>
              <div className="text-[11px]" style={{color:"#8C7F73"}}>📎 {op.source}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ----------------- App Shell -----------------
function App() {
  const [track, setTrack] = useState("A");
  const [view, setView] = useState("V1"); // V1 Overview, V2 MindMap, V3 SuccessFormula, V4 Drilldown
  const [selectedH, setSelectedH] = useState(null);
  const [selectedI, setSelectedI] = useState(null);
  const [query, setQuery] = useState("");
  const [searchResults, setSearchResults] = useState(null);

  function jumpTo(v, id, contentId) {
    setView(v);
    if (v==="V4" && id) setSelectedH(id);
    if (v==="V3" && id) {
      setSelectedI(id);
      setTimeout(()=>{
        const el = document.getElementById("insight-"+id);
        if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
      }, 100);
    }
  }

  function onGlobalSearch(q) {
    setQuery(q);
    if (!q) { setSearchResults(null); return; }
    const lq = q.toLowerCase();
    const hits = {
      H: HYPOTHESES.filter(h => h.title.toLowerCase().includes(lq) || h.id.toLowerCase().includes(lq)),
      C: CONTENTS.filter(c => c.title.toLowerCase().includes(lq) || c.id.toLowerCase().includes(lq)),
      I: INSIGHTS.filter(i => i.headline.toLowerCase().includes(lq) || i.id.toLowerCase().includes(lq)),
    };
    setSearchResults(hits);
  }

  return (
    <div className="min-h-screen">
      {/* Header */}
      <header className="sticky top-0 z-30 backdrop-blur" style={{background:"rgba(250,247,241,0.85)", borderBottom:"1px solid #E5DDD0"}}>
        <div className="max-w-[1400px] mx-auto px-5 py-3 flex items-center gap-4">
          <div className="flex-1">
            <div className="flex items-baseline gap-2">
              <h1 className="font-display text-xl tracking-tight" style={{color:"#2B2520"}}>{META.title}</h1>
              <span className="text-[11px] font-mono px-1.5 py-0.5 rounded" style={{background:"#F4EFE5", color:"#8C7F73"}}>{META.version}</span>
            </div>
            <div className="text-[11px] mt-0.5" style={{color:"#8C7F73"}}>밀키토너 — 가설·검증·인사이트 가계도</div>
          </div>
          <div className="relative">
            <input
              type="text"
              value={query}
              onChange={(e)=>onGlobalSearch(e.target.value)}
              placeholder="🔍 가설 · 콘텐츠 · 인사이트 검색"
              className="text-sm px-3 py-1.5 rounded-md w-72 focus:outline-none"
              style={{background:"#FFFDF8", border:"1px solid #E5DDD0", color:"#2B2520"}}
            />
            {searchResults && (
              <div className="absolute top-full right-0 mt-1 w-96 card-deep p-2 max-h-96 overflow-y-auto z-40">
                {["H","C","I"].map(k => searchResults[k].length>0 && (
                  <div key={k} className="mb-2">
                    <div className="text-[10px] font-semibold px-2 py-1" style={{color:"#8C7F73"}}>
                      {k==="H"?"가설":k==="C"?"콘텐츠":"인사이트"} ({searchResults[k].length})
                    </div>
                    {searchResults[k].slice(0,5).map(item=>(
                      <button key={item.id} onClick={()=>{
                        if (k==="H") { setTrack(item.track); jumpTo("V4", item.id); }
                        else if (k==="I") { setTrack(item.track); jumpTo("V3", item.id); }
                        else { setTrack(item.track); jumpTo("V4", item.hypothesis_ids?.[0]); }
                        setQuery(""); setSearchResults(null);
                      }} className="w-full text-left p-2 rounded hover:bg-cream-deep flex items-start gap-2"
                        style={{background:undefined}}>
                        <IdChip id={item.id} />
                        <div className="text-xs flex-1" style={{color:"#2B2520"}}>{item.title || item.headline}</div>
                      </button>
                    ))}
                  </div>
                ))}
                {Object.values(searchResults).every(a=>a.length===0) && (
                  <div className="p-3 text-xs text-center" style={{color:"#8C7F73"}}>검색 결과 없음</div>
                )}
              </div>
            )}
          </div>
          <div className="text-right">
            <div className="text-[10px]" style={{color:"#8C7F73"}}>마지막 업데이트</div>
            <div className="text-xs font-mono" style={{color:"#5A4F47"}}>{META.lastUpdate}</div>
          </div>
        </div>

        {/* Resources row */}
        <div className="max-w-[1400px] mx-auto px-5 pb-2 flex items-center flex-wrap gap-1.5">
          <span className="text-[10px] mr-1" style={{color:"#8C7F73"}}>리소스:</span>
          {RESOURCES.map((r,i)=>(
            <a key={i} href={r.url} target="_blank" rel="noopener noreferrer"
              className="text-[11px] px-2 py-0.5 rounded-full hover:opacity-80"
              style={{background:"#F4EFE5", color:"#5A4F47", border:"1px solid #E5DDD0"}}>
              {r.label} <span style={{fontSize:"9px", opacity:0.6}}>↗</span>
            </a>
          ))}
        </div>

        {/* Track switcher */}
        <div className="max-w-[1400px] mx-auto px-5 pb-2.5 flex items-center gap-2">
          {Object.values(TRACKS).map(t => (
            <button key={t.id} onClick={()=>{
                setTrack(t.id);
                if (t.id==="C" || t.id==="E") setView("V_SINGLE");
                else if (view==="V_SINGLE") setView("V1");
              }}
              className={`px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-1.5 ${track===t.id?"track-active":"track-inactive"}`}>
              <span>{t.icon}</span>
              <span>{t.label}</span>
              <span className="text-[10px] opacity-75 hidden md:inline">— {t.desc}</span>
            </button>
          ))}
        </div>

        {/* View tabs */}
        {track !== "C" && track !== "E" && (
          <div className="max-w-[1400px] mx-auto px-5 pb-2.5 flex items-center gap-1.5">
            {[
              {k:"V1", label:"Overview"},
              {k:"V2", label:"Mind Map"},
              {k:"V3", label:"성공공식"},
              {k:"V4", label:"자세히 보기"},
            ].map(t => (
              <button key={t.k} onClick={()=>setView(t.k)}
                className={`px-2.5 py-1 rounded text-xs font-medium ${view===t.k?"tab-active":"tab-inactive"}`}>
                {t.label}
              </button>
            ))}
          </div>
        )}
      </header>

      <main className="max-w-[1400px] mx-auto px-5 py-6">
        {track==="C" ? (
          <ViewOpsLog />
        ) : track==="E" ? (
          <ViewTracker />
        ) : view==="V1" ? (
          <ViewOverview track={track} jumpTo={jumpTo} />
        ) : view==="V2" ? (
          <ViewMindMap track={track} jumpTo={jumpTo} />
        ) : view==="V3" ? (
          <div id="insight-anchor">
            <ViewSuccessFormula track={track} jumpTo={jumpTo} />
          </div>
        ) : view==="V4" ? (
          <ViewDrilldown track={track} selectedId={selectedH} setSelectedId={setSelectedH} query={query} jumpTo={jumpTo} />
        ) : null}
      </main>

      <footer className="max-w-[1400px] mx-auto px-5 pb-8 pt-4 text-center text-[11px]" style={{color:"#8C7F73"}}>
        색동서울 콘텐츠 플레이북 v1.0 · 출처: 노션 위클리 체크인 시리즈 / 콘텐츠 리뷰 / 우지 전달 (2025.11~2026.05) ·
        다음 콘텐츠 기획 시작 전 5분 안에 「비슷한 가설 시도됐는지 / 어디서 파생됐는지 / 현재 어디까지 왔는지 / 다음 재료」 찾기
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
